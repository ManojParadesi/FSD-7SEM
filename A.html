<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App ☀️</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      color: #fff;
    }

    .weather-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      width: 360px;
      text-align: center;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
    }

    .weather-app-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .city-input {
      width: 80%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
      margin-bottom: 15px;
      text-align: center;
    }

    .get-weather-button {
      display: inline-block;
      padding: 12px 25px;
      background: #ff7eb3;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    .get-weather-button:hover {
      background: #ff5277;
      transform: scale(1.05);
    }

    .weather-info {
      background: rgba(0, 0, 0, 0.25);
      padding: 15px;
      border-radius: 15px;
      margin-top: 10px;
    }

    .weather-info p {
      margin: 8px 0;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="weather-container">
    <h1 class="weather-app-title">Weather App ☀️</h1>

    <input 
      type="text" 
      id="cityInput" 
      placeholder="Enter city name..." 
      class="city-input"
    >
    
    <button id="getWeatherBtn" class="get-weather-button">Get Weather</button>
    
    <div id="weatherInfo" class="weather-info">
      <p>Enter a city name and click "Get Weather" to see the current conditions.</p>
    </div>
  </div>

  <script>
    const apiKey = "253d813628bc1d72ba9040ade0d4b97a"; // Your API Key
    const getWeatherBtn = document.getElementById("getWeatherBtn");
    const cityInput = document.getElementById("cityInput");
    const weatherInfo = document.getElementById("weatherInfo");

    getWeatherBtn.addEventListener("click", () => {
      const city = cityInput.value.trim();
      if (city === "") {
        weatherInfo.innerHTML = "<p>Please enter a city name 🌍</p>";
        return;
      }

      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
        .then(response => response.json())
        .then(data => {
          if (data.cod === 200) {
            weatherInfo.innerHTML = `
              <p><strong>${data.name}, ${data.sys.country}</strong></p>
              <p>🌡️ Temperature: ${data.main.temp} °C</p>
              <p>☁️ Weather: ${data.weather[0].description}</p>
              <p>💨 Wind Speed: ${data.wind.speed} m/s</p>
              <p>🌡️ Feels Like: ${data.main.feels_like} °C</p>
            `;
          } else {
            weatherInfo.innerHTML = `<p>❌ City not found. Please try again.</p>`;
          }
        })
        .catch(() => {
          weatherInfo.innerHTML = "<p>⚠️ Error fetching weather data.</p>";
        });
    });
  </script>
</body>
</html>
